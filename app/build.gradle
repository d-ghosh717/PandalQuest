plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

def routeSecrets = new Properties()
def routeSecretsFile = rootProject.file("secrets.properties")
if (routeSecretsFile.exists()) {
    routeSecretsFile.withInputStream { routeSecrets.load(it) }
}
def localSecretsFile = rootProject.file("local.properties")
if (localSecretsFile.exists()) {
    localSecretsFile.withInputStream { routeSecrets.load(it) }
}
def routesApiKey = routeSecrets.getProperty("ROUTES_API_KEY", System.getenv("ROUTES_API_KEY") ?: "")
def orsApiKey = routeSecrets.getProperty("ORS_API_KEY", System.getenv("ORS_API_KEY") ?: "")
def supabaseUrl = routeSecrets.getProperty("SUPABASE_URL", "https://ittdzzuzgkavkeiookin.supabase.co")
def supabaseKey = routeSecrets.getProperty("SUPABASE_PUBLISHABLE_KEY", "sb_publishable_3jZnGgxDoeDBmcDtlDlcow_6hBqnqjV")

android {
    namespace 'com.pandalfinder'
    // MapLibre's current AndroidX transitive dependencies require API 34 to compile.
    compileSdk 34
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.pandalfinder"
        minSdk 24
        targetSdk 33
        versionCode 6
        versionName "2.1.2"
        buildConfigField "String", "GOOGLE_ROUTES_API_KEY", "\"${routesApiKey.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField "String", "ORS_API_KEY", "\"${orsApiKey.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", "\"${supabaseKey.replace('\\', '\\\\').replace('\"', '\\\"')}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def defaultKeystore = file("${System.getProperty('user.home')}/.android/debug.keystore")
            def customKeystorePath = project.findProperty("KEYSTORE_PATH") ?: System.getenv("KEYSTORE_PATH")
            storeFile = customKeystorePath ? file(customKeystorePath) : defaultKeystore
            storePassword = (project.findProperty("KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD") ?: "android").toString()
            keyAlias = (project.findProperty("KEY_ALIAS") ?: System.getenv("KEY_ALIAS") ?: "androiddebugkey").toString()
            keyPassword = (project.findProperty("KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD") ?: "android").toString()
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    
    // Google Play Services for Location
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // MapLibre renders OpenStreetMap-compatible map styles without a Google Maps key.
    implementation 'org.maplibre.gl:android-sdk:11.8.0'

    // Firestore, Firebase Realtime Database & Firebase Auth
    implementation 'com.google.firebase:firebase-firestore-ktx:25.1.1'
    implementation 'com.google.firebase:firebase-database-ktx:21.0.0'
    implementation 'com.google.firebase:firebase-auth-ktx:22.3.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
